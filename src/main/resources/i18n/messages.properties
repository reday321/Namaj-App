# ---------------------------------------------------------------------------
#  Salah Guardian - English (default / fallback bundle)
# ---------------------------------------------------------------------------
#  Keys are grouped by the screen they appear on. Every key here MUST have a
#  counterpart in each translated bundle; SettingsBundleTest enforces that.
#
#  Placeholders use MessageFormat syntax ({0}, {1}), so a translation may put
#  them in a different order from English where the grammar requires it.
#
#  Files are read as UTF-8 (Java 9+), so text is written in its own script.
# ---------------------------------------------------------------------------

